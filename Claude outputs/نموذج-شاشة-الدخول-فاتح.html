body{margin:0;padding:24px;background:#e9eef5;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;display:flex;gap:24px;justify-content:center}

.ld{width:380px;height:440px;border-radius:18px;display:grid;place-items:center;box-shadow:0 10px 30px -14px rgba(7,27,58,.35);overflow:hidden}
.v1{background:#fff}
.v2{background:radial-gradient(120% 90% at 80% 0%,#ffffff,#F2F7FD 55%,#E3EEFB)}
.v3{background:linear-gradient(180deg,#fff,#F4FBF8)}
.ld-in{display:flex;flex-direction:column;align-items:center;gap:14px;color:#102033}
.ld-row{display:flex;align-items:center;gap:14px}

.ld-arrows path{opacity:.15;animation:a 1.1s ease-in-out infinite}.ld-arrows .a2{animation-delay:.28s}

.ld-mark{position:relative;width:96px;height:96px;display:grid;place-items:center}.ld-ring{position:absolute;inset:0;animation:s 1.4s linear infinite}.rt{stroke:#E3EAF4}
@keyframes s{to{transform:rotate(360deg)}}
.ld-logo{width:54px;height:46px}.lg-b{fill:#1f67cf}.lg-g{fill:#17ad70}
.ld-hello b{font-size:1.4rem}.ld-name{font-weight:700;letter-spacing:.18em;font-size:1.3rem;color:#0b3f8d}
.ld-sub{display:flex;flex-direction:column;align-items:center;font-size:.85rem;color:#506584;margin-top:-8px}.ld-sub span{font-size:.75rem}

@keyframes b{0%{transform:translateX(260%)}100%{transform:translateX(-160%)}}
