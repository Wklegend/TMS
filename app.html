<style>
/* Layout: right-hand rail (RTL) + working canvas; on phones the rail becomes a bottom bar. Ledger-like tables, status by stripe + pill. */
:root{
  /* one palette for the whole platform, built from lms.rpi.sa: navy #071b3a · blue #093271/#1952A6 · green #11a765/#17ad70/#20c083 · ink #102033 · muted #506584.
     Status colours stay in the same family: done = green, in progress = blue, on hold = slate blue, not started = blue-grey; late (red) and near (amber) are the only warm hues. */
  --bg:#F4F6F8; --bg-page:#F4F6F8; --surface:#FFFFFF; --surface-2:#EEF2F5; --ink:#24323A; --muted:#56656E; --line:#D9E1E6;
  --accent:#093271; --accent-ink:#FFFFFF; --accent-soft:#DDE8F7; --brand-green:#17ad70; --brand-blue:#1952A6; --brand-navy:#071b3a;
  --saffron:#17ad70; --saffron-soft:#DCF4E9;
  --late:#D23B4E; --late-soft:#FBE4E8; --warn:#D9890F; --warn-soft:#FCEFD9; --ok:#11a765; --ok-soft:#DCF4E9; --info:#1952A6; --info-soft:#E0ECFB; --hold:#7C8DB5; --hold-soft:#E7ECF6;
  --ai:#0E8FB0; --ai-soft:#DDF2F8;
  --shadow:0 1px 2px rgba(7,27,58,.06),0 6px 20px rgba(7,27,58,.07);
  --f-display:"IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:10px;
}
@media not all{/* dark mode off: every page uses the light white-blue palette */:root:not([data-theme="light"]){
  --bg:#061426; --bg-page:#061426; --surface:#0B1D37; --surface-2:#11284A; --ink:#E8F1FC; --muted:#9DB1CE; --line:#1F3A62;
  --accent:#5B9BF0; --accent-ink:#071b3a; --accent-soft:#132F57; --brand-green:#20c083; --brand-blue:#5B9BF0; --brand-navy:#E8F1FC;
  --saffron:#20c083; --saffron-soft:#10372A;
  --late:#F07A8A; --late-soft:#3A1824; --warn:#F0B04E; --warn-soft:#3A2A12; --ok:#20c083; --ok-soft:#10372A; --info:#7FB0F5; --info-soft:#132E52; --hold:#A5B4D6; --hold-soft:#1E2C4A;
  --ai:#5CC8E4; --ai-soft:#0F3245; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#061426; --bg-page:#061426; --surface:#0B1D37; --surface-2:#11284A; --ink:#E8F1FC; --muted:#9DB1CE; --line:#1F3A62;
  --accent:#5B9BF0; --accent-ink:#071b3a; --accent-soft:#132F57; --brand-green:#20c083; --brand-blue:#5B9BF0; --brand-navy:#E8F1FC;
  --saffron:#20c083; --saffron-soft:#10372A;
  --late:#F07A8A; --late-soft:#3A1824; --warn:#F0B04E; --warn-soft:#3A2A12; --ok:#20c083; --ok-soft:#10372A; --info:#7FB0F5; --info-soft:#132E52; --hold:#A5B4D6; --hold-soft:#1E2C4A;
  --ai:#5CC8E4; --ai-soft:#0F3245; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.28); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg-page,var(--bg));background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
html[dir="ltr"] body{font-family:"IBM Plex Sans Arabic",system-ui,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,.tab{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:1.6rem} h2{font-size:1.2rem} h3{font-size:1.02rem}
.app{display:grid;grid-template-columns:1fr;min-height:100%}
@media (min-width:900px){.app{grid-template-columns:232px 1fr}}
/* rail */
.rail{display:none}
@media (min-width:900px){.rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:20px 14px;border-inline-start:0;border-inline-end:1px solid var(--line);background:var(--surface);overflow:auto}}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand-mark{width:40px;height:36px;border-radius:0;background:none;padding:2px;color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:1.15rem}
.brand b{font-family:var(--f-display);font-size:1.1rem;font-weight:600;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:.75rem}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:start;color:var(--muted);font-weight:500}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-btn svg{width:18px;height:18px;flex:none}
.nav-btn .cnt{margin-inline-start:auto;font-size:.72rem;background:var(--late-soft);color:var(--late);border-radius:20px;padding:0 7px;font-weight:600}
.rail-sep{font-size:.7rem;color:var(--muted);letter-spacing:.04em;padding:14px 10px 4px}
/* collapsible icon rail: icons only, expands over the page on hover or keyboard focus */
.nav-i{position:relative;display:grid;place-items:center;flex:none;width:22px;height:22px}
.nav-l{white-space:nowrap;overflow:hidden;min-width:0}
@media (min-width:900px){
  .app{grid-template-columns:76px 1fr!important}
  .rail{position:fixed!important;top:env(safe-area-inset-top,0px);bottom:0;inset-inline-start:0;height:auto!important;width:76px;z-index:40;overflow-x:hidden!important;transition:width .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;padding-inline:14px!important}
  .main{grid-column:2}
  .rail.open{width:248px;box-shadow:0 0 40px -10px rgba(7,27,58,.35)}
  .rail .nav-l{opacity:0;max-width:0;transition:opacity .2s,max-width .35s}
  .rail.open .nav-l{opacity:1;max-width:200px;transition:opacity .3s .08s,max-width .35s}
  .rail .brand{padding-inline:2px}.rail .nav-btn{justify-content:flex-start;padding-inline:13px;gap:12px}
  .rail .nav-btn .cnt{position:absolute;top:-5px;inset-inline-end:-6px;z-index:2;margin:0;font-size:.62rem;padding:0 5px;line-height:1.5;box-shadow:0 0 0 2px var(--surface)}
  .rail-sep{height:18px;padding:0 10px;position:relative}.rail-sep::after{content:"";position:absolute;inset-inline:12px;top:9px;border-top:1px solid var(--line);transition:opacity .2s}
  .rail.open .rail-sep{height:auto;padding:14px 10px 4px}.rail.open .rail-sep::after{opacity:0}
  .rail:not(.open) [data-tip]{}
  .rail .nav-btn svg{transition:transform .3s cubic-bezier(.2,.9,.25,1.5)}.rail .nav-btn:hover svg{transform:scale(1.15)}
}
@media (min-width:900px) and (prefers-reduced-motion:reduce){.rail,.rail .nav-l{transition:none}}
/* rail icons: morphing blob, glow ring, lift + larger label, shine sweep */
@media (min-width:900px){
  .rail .nav-btn{position:relative;overflow:hidden;padding-inline:6px!important;transition:background .25s,color .25s}
  .rail .nav-i{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,color-mix(in srgb,#fff 70%,transparent),color-mix(in srgb,var(--accent) 10%,transparent));border:1px solid color-mix(in srgb,#fff 70%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 2px 6px -3px rgba(7,27,58,.35);transition:transform .45s cubic-bezier(.2,.9,.25,1.5),box-shadow .35s,background .35s,color .35s}
  .rail .nav-i svg{width:19px;height:19px}
  .rail .nav-btn:hover .nav-i,.rail .nav-btn:focus-visible .nav-i{transform:scale(1.14) rotate(-6deg);color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface));
    box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent),0 0 18px 2px color-mix(in srgb,var(--brand-green) 45%,transparent);animation:morphBlob 2.4s ease-in-out infinite}
  .rail .nav-btn[aria-current="page"]{background:none}
  .rail .nav-btn[aria-current="page"] .nav-i{color:#fff;border-color:rgba(255,255,255,.35);background:linear-gradient(145deg,rgba(255,255,255,.35),rgba(255,255,255,0) 45%),linear-gradient(135deg,var(--accent),var(--brand-green));box-shadow:0 6px 16px -6px color-mix(in srgb,var(--accent) 70%,transparent);animation:morphBlob 6s ease-in-out infinite}
  .rail .nav-l{transition:opacity .2s,max-width .35s,font-size .25s,letter-spacing .25s}
  .rail.open .nav-btn:hover .nav-l,.rail.open .nav-btn:focus-visible .nav-l{color:var(--ink)}
  .rail .nav-btn::after{content:"";position:absolute;top:0;bottom:0;width:40%;inset-inline-start:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);opacity:0;pointer-events:none}
  .rail .nav-btn:hover::after{animation:shine .9s ease-out}
  .rail .nav-btn:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
  .rail .brand-mark{transition:transform .5s cubic-bezier(.2,.9,.25,1.5),filter .4s}.rail .brand:hover .brand-mark{transform:scale(1.12) rotate(8deg);filter:drop-shadow(0 0 8px color-mix(in srgb,var(--brand-green) 55%,transparent))}
}
@keyframes morphBlob{0%,100%{border-radius:12px}25%{border-radius:58% 42% 55% 45%/45% 55% 45% 55%}50%{border-radius:50%}75%{border-radius:42% 58% 40% 60%/60% 40% 60% 40%}}
@keyframes shine{0%{inset-inline-start:-60%;opacity:1}100%{inset-inline-start:130%;opacity:0}}
@media (prefers-reduced-motion:reduce){.rail .nav-i,.rail .nav-btn::after{animation:none!important;transition:none}}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center}
.search{flex:1;min-width:0;position:relative;display:flex;align-items:center}
.search #searchBtn{position:relative;z-index:2;transition:border-color .2s,color .2s}
.search input{width:0;opacity:0;padding-block:9px;padding-inline:44px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);position:absolute;inset-inline-start:0;transition:width .45s cubic-bezier(.2,.9,.25,1.1),opacity .25s;pointer-events:none}
.search.open input{width:min(460px,100%);opacity:1;pointer-events:auto;box-shadow:0 8px 24px -14px rgba(7,27,58,.4)}
.search.open #searchBtn{border-color:transparent;background:none;color:var(--accent)}
@media (max-width:600px){.search.open input{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);inset-inline:12px;width:auto;height:40px;z-index:25}.search.open #searchBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);inset-inline-start:12px;z-index:26}}
.add-btn{height:40px;border-radius:999px;padding-inline:14px 18px;gap:6px;flex:none;box-shadow:0 8px 18px -10px var(--accent)}
.add-btn svg{width:18px;height:18px;transition:transform .35s cubic-bezier(.2,.9,.25,1.5)}.add-btn[aria-expanded="true"] svg{transform:rotate(135deg)}
@media (max-width:600px){.add-btn .add-l{display:none}.add-btn{padding:0;width:40px;justify-content:center}}

<script>/* entry sound (Sound/Tech.mp3): plays ONCE — when entering the site, and once after each sign-in; not on refresh; follows the sound switch (tms-sound) */
window.TMS_TECH=(function(){var a=null,VOL=.5,PAGE='app';
function on(){try{return localStorage.getItem('tms-sound')!=='off'}catch(e){return true}}
function mark(){try{if(PAGE==='app'){var s=sessionStorage.getItem('tms:session')||localStorage.getItem('tms:session')||'';return 'app:'+s}return 'landing'}catch(e){return PAGE}}
function played(){try{return sessionStorage.getItem('tms:tech')===mark()}catch(e){return false}}
function setPlayed(){try{sessionStorage.setItem('tms:tech',mark())}catch(e){}}
function el(){if(!a){a=new Audio('Sound/Tech.mp3');a.preload='auto';a.volume=VOL;a.addEventListener('ended',function(){a.currentTime=0})}return a}
function play(force){if(!on()||(!force&&played()))return;try{var p=el().play();if(p&&p.then)p.then(setPlayed,arm);else setPlayed()}catch(e){}}
function stop(){if(a){try{a.pause()}catch(e){}}}
function arm(){var go=function(){rm();play()};var rm=function(){['pointerdown','keydown','touchstart'].forEach(function(t){removeEventListener(t,go,true)})};['pointerdown','keydown','touchstart'].forEach(function(t){addEventListener(t,go,{capture:true,passive:true})})}
document.addEventListener('visibilitychange',function(){if(!a||a.ended||a.currentTime===0)return;if(document.hidden)a.pause();else if(on())a.play().catch(function(){})});
play();return{play:function(){play(true)},stop:stop}})();</script>

function reportRange(fs) {
  const t = todayStr(); const p = fs.period || 'month';

  if (p === 'quarter') { const m = +t.slice(5, 7); const qs = Math.floor((m - 1) / 3) * 3 + 1; const s = `${t.slice(0, 4)}-${String(qs).padStart(2, '0')}-01`; return [s, monthEnd(`${t.slice(0, 4)}-${String(qs + 2).padStart(2, '0')}-01`)]; }

const AI_RULES = 'أنت مساعد إدارة أعمال داخل نظام لإدارة المهام والمشاريع والتدريب والابتكار. القواعد: (1) استند فقط إلى السجلات المعطاة، ولا تخترع بيانات أو تحديثات أو إنجازات. (2) بعد كل معلومة اذكر رمز السجل الذي استندت إليه بين قوسين مربعين مثل [T-12]. (3) إذا كانت معلومة لازمة غير موجودة فقل ذلك صراحة. (4) ابدأ كل اقتراح بكلمة «اقتراح:» وفسّر سببه. (5) لا تعتبر مهمة مكتملة لمجرد مرور موعدها. (6) اكتب بالعربية الفصحى بإيجاز، بنقاط قصيرة دون تنسيق Markdown ثقيل.';

const AI_PRESETS = { today: 'اقترح أولويات اليوم (حتى 7 بنود مرتبة)، ومع كل بند سبب الاقتراح والسجل الذي استند إليه.', week: 'اقترح خطة أولويات لهذا الأسبوع مقسمة على الأيام، مع السبب لكل بند.', summary: 'لخّص حالة المشاريع والتدريب والتكليفات في فقرات قصيرة، ثم أبرز 3 مخاطر.', conflicts: 'اكشف التعارضات المحتملة بين المواعيد، والمهام المتأخرة، والمهام التي بلا مسؤول، والاعتماديات المعرضة للخطر. رتبها حسب الخطورة.', next: 'اقترح الخطوات التالية للمشاريع النشطة والدورات القادمة.', report: 'صغ مسودة تقرير أسبوعي موجز للإدارة: الإنجازات، التأخيرات، المخاطر، القرارات المطلوبة.', ideas: 'اقترح 5 أفكار منتجات أو خدمات جديدة مستوحاة من أعمالي المسجلة، مع المشكلة والمستفيدين والقيمة لكل فكرة.', reminders: 'صغ مسودات تذكير قصيرة ومهذبة للموظفين المتأخرين في تكليفاتهم أو مهامهم، لكل موظف رسالة منفصلة. لا تُرسل شيئًا.' };
const AI_EMP_PRESETS = { today: 'ما الذي يجب أن أبدأ به اليوم من تكليفاتي ولماذا؟', update: 'ساعدني في صياغة تحديث موجز لمديري عن تكليفاتي بناءً على حالتي المسجلة.' };

function openAssistant(preset) {
  const out = h('div', { style: 'display:flex;flex-direction:column;gap:10px' }); const chat = []; let ctx = null;

    !S.caps.sample ? h('div', { class: 'banner warn' }, icon('alert'), 'المساعد غير متاح هنا. افتح الموقع داخل Claude ووافق على استخدام Claude عند الطلب.') : null,
    h('div', { class: 'chip-row' }, Object.entries(presets).map(([k, p]) => h('button', { class: 'chip', disabled: !S.caps.sample, onclick: () => run(p, labels[k]) }, labels[k]))),
    box, h('div', { class: 'row' }, h('button', { class: 'btn ai', disabled: !S.caps.sample, onclick: () => { const v = box.value.trim(); if (v) { box.value = ''; run(v); } } }, icon('ai'), 'اسأل'), h('button', { class: 'btn ghost sm', onclick: () => { chat.length = 0; out.replaceChildren(); } }, 'محادثة جديدة')), out];
  openDrawer('المساعد الذكي', body);
  if (preset && presets[preset] && S.caps.sample) run(presets[preset], labels[preset]);
}

    !items.length ? h('div', { class: 'panel' }, emptyState('لا تكليفات بعد', 'طلبك وصل. ستظهر التكليفات هنا بعد أن يربط المدير حسابك ويسند إليك عملًا.')) : null,

function openEmpItem(id) {
