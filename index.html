<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>مكتب وليد</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* Layout: right-hand rail (RTL) + working canvas; on phones the rail becomes a bottom bar. Ledger-like tables, status by stripe + pill. */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --surface-2:#EBEFEA; --ink:#17201C; --muted:#5B6862; --line:#D8DFDA;
  --accent:#1D5C50; --accent-ink:#FFFFFF; --accent-soft:#DCEBE6; --saffron:#B97A0C; --saffron-soft:#F6EBD3;
  --late:#B3362C; --late-soft:#F8E1DE; --warn:#A86A00; --warn-soft:#FBEFD6; --ok:#2B7A4B; --ok-soft:#DDF0E3; --info:#2F5D9A; --info-soft:#E0E9F6; --hold:#6B5A8E; --hold-soft:#ECE6F5;
  --ai:#5A4AA8; --ai-soft:#ECE9FA;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 6px 20px rgba(20,40,30,.06);
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#161D1A; --surface-2:#1D2622; --ink:#E4EBE7; --muted:#9AA8A1; --line:#2A3530;
  --accent:#5DB6A1; --accent-ink:#0B1310; --accent-soft:#1D3530; --saffron:#E3AE4A; --saffron-soft:#3A2F17;
  --late:#F08A7F; --late-soft:#3D1F1C; --warn:#E8B04A; --warn-soft:#3A2D14; --ok:#6FCB92; --ok-soft:#183324; --info:#8DB4EA; --info-soft:#1A2A40; --hold:#B9A6E0; --hold-soft:#2A2340;
  --ai:#ADA0F0; --ai-soft:#25213F; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#161D1A; --surface-2:#1D2622; --ink:#E4EBE7; --muted:#9AA8A1; --line:#2A3530;
  --accent:#5DB6A1; --accent-ink:#0B1310; --accent-soft:#1D3530; --saffron:#E3AE4A; --saffron-soft:#3A2F17;
  --late:#F08A7F; --late-soft:#3D1F1C; --warn:#E8B04A; --warn-soft:#3A2D14; --ok:#6FCB92; --ok-soft:#183324; --info:#8DB4EA; --info-soft:#1A2A40; --hold:#B9A6E0; --hold-soft:#2A2340;
  --ai:#ADA0F0; --ai-soft:#25213F; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
html[dir="ltr"] body{font-family:"IBM Plex Sans Arabic",system-ui,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,.tab{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:1.6rem} h2{font-size:1.2rem} h3{font-size:1.02rem}
.app{display:grid;grid-template-columns:1fr;min-height:100%}
@media (min-width:900px){.app{grid-template-columns:232px 1fr}}
/* rail */
.rail{display:none}
@media (min-width:900px){.rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:20px 14px;border-inline-start:0;border-inline-end:1px solid var(--line);background:var(--surface);overflow:auto}}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:1.15rem}
.brand b{font-family:var(--f-display);font-size:1.1rem;font-weight:600;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:.75rem}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:start;color:var(--muted);font-weight:500}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-btn svg{width:18px;height:18px;flex:none}
.nav-btn .cnt{margin-inline-start:auto;font-size:.72rem;background:var(--late-soft);color:var(--late);border-radius:20px;padding:0 7px;font-weight:600}
.rail-sep{font-size:.7rem;color:var(--muted);letter-spacing:.04em;padding:14px 10px 4px}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;padding-block:9px;padding-inline:38px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.search svg{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.icon-btn{position:relative;flex:none;width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:19px;height:19px}
.icon-btn .dot{position:absolute;top:5px;inset-inline-end:6px;min-width:17px;height:17px;border-radius:9px;background:var(--late);color:#fff;font-size:.66rem;display:grid;place-items:center;padding:0 4px;font-weight:700}
.icon-btn.lang{width:auto;padding:0 10px;gap:6px;display:flex;align-items:center;font-weight:700;font-size:.85rem}
.icon-btn.lang svg{width:17px;height:17px}
.icon-btn.ai{color:var(--ai);border-color:color-mix(in srgb,var(--ai) 35%,var(--line))}
.clock{font-size:.78rem;color:var(--muted);white-space:nowrap;display:none}
@media (min-width:700px){.clock{display:block}}
.content{padding-block:22px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;width:100%;margin-inline:auto;display:flex;flex-direction:column;gap:22px}
@media (min-width:900px){.content{padding-bottom:40px}}
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.page-head p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1}
/* bottom bar */
.bottombar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@media (min-width:900px){.bottombar{display:none}}
.bottombar button{border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--muted);cursor:pointer}
.bottombar button svg{width:21px;height:21px}
.bottombar button[aria-current="page"]{color:var(--accent);font-weight:600}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--late);border-color:color-mix(in srgb,var(--late) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn.ai{color:var(--ai);border-color:color-mix(in srgb,var(--ai) 40%,var(--line));background:var(--ai-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel-h h2,.panel-h h3{flex:1}
.panel-b{padding:14px 16px}
.panel-b.tight{padding:6px 0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr}
.g3{grid-template-columns:1fr}
@media (min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
@media (min-width:1150px){.g3{grid-template-columns:1fr 1fr 1fr}}
.span2{grid-column:1/-1}
@media (min-width:1150px){.g3 .span2{grid-column:span 2}}
.muted{color:var(--muted)}
.small{font-size:.83rem}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:.9rem}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}
/* stat strip */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stats>.stat:last-child:nth-child(odd){grid-column:1/-1}
@media (min-width:760px){.stats{grid-template-columns:repeat(5,1fr)}.stats>.stat:last-child:nth-child(odd){grid-column:auto}}
.stat{background:var(--surface);padding:12px 16px;cursor:pointer;border:0;text-align:start}
.stat:hover{background:var(--surface-2)}
.stat .v{font-size:1.65rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2;font-family:var(--f-display)}
.stat .l{font-size:.8rem;color:var(--muted)}
.stat.late .v{color:var(--late)} .stat.warn .v{color:var(--warn)} .stat.ok .v{color:var(--ok)}
/* list items */
.items{list-style:none;margin:0;padding:0}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.item:last-child{border-bottom:0}
.item:hover{background:var(--surface-2)}
.item .stripe{position:absolute;inset-inline-start:0;top:8px;bottom:8px;width:3px;border-radius:2px}
.item .body{flex:1;min-width:0}
.item .t{font-weight:500;overflow-wrap:anywhere}
.item .m{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.item .side{text-align:end;font-size:.8rem;white-space:nowrap}
.code{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:600;padding:1px 9px;border-radius:20px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.todo{background:var(--surface-2);color:var(--muted)}
.pill.doing{background:var(--info-soft);color:var(--info)}
.pill.hold{background:var(--hold-soft);color:var(--hold)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.cancel{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.pill.late{background:var(--late-soft);color:var(--late)}
.pill.soon{background:var(--warn-soft);color:var(--warn)}
.pill.ai{background:var(--ai-soft);color:var(--ai)}
.pill.p1{background:var(--late-soft);color:var(--late)} .pill.p2{background:var(--saffron-soft);color:var(--saffron)} .pill.p3{background:var(--surface-2);color:var(--ink)} .pill.p4{background:var(--surface-2);color:var(--muted)}
.bar{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.late>i{background:var(--late)}
/* tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.78rem;background:var(--surface-2);position:sticky;top:0;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
tr.bad td{background:var(--late-soft)} tr.dup td{background:var(--warn-soft)}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters input,.inp{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0;max-width:100%}
/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.kcol.over{outline:2px dashed var(--accent)}
.kcol h3{font-size:.9rem;display:flex;gap:6px;align-items:center;font-family:var(--f-body);font-weight:600}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:grab;display:flex;flex-direction:column;gap:5px;font-size:.88rem}
.kcard.is-late{border-inline-start:3px solid var(--late)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.cal .dh{background:var(--surface-2);padding:6px;font-size:.75rem;color:var(--muted);text-align:center;font-weight:600}
.cal .day{background:var(--surface);min-height:96px;padding:5px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .day.out{background:var(--bg)} .cal .day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .dn{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cal .ev{font-size:.72rem;padding:1px 5px;border-radius:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;background:var(--surface-2)}
.ev.task{background:var(--info-soft);color:var(--info)} .ev.late{background:var(--late-soft);color:var(--late)} .ev.course{background:var(--saffron-soft);color:var(--saffron)} .ev.asg{background:var(--hold-soft);color:var(--hold)} .ev.phase{background:var(--accent-soft);color:var(--accent)} .ev.done{background:var(--ok-soft);color:var(--ok)}
.cal.week .day{min-height:240px}
@media (max-width:600px){.cal .day{min-height:64px}.cal .ev{font-size:0;height:6px;padding:0}.cal.week{grid-template-columns:1fr}.cal.week .dh{display:none}.cal.week .day{min-height:auto}.cal.week .ev{font-size:.75rem;height:auto;padding:2px 6px}}
/* modal & drawers */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.42);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:max(4vh,env(safe-area-inset-top,0px)) 12px 12px;overflow:auto}
.modal{background:var(--surface);border-radius:14px;width:min(760px,100%);box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:none}
.modal.wide{width:min(1100px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h2{flex:1}
.modal-b{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center;position:sticky;bottom:0;background:var(--surface);border-radius:0 0 14px 14px}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(470px,100%);z-index:60;background:var(--surface);border-inline-start:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}
.drawer-b{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.form{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.form{grid-template-columns:1fr 1fr}}
.form .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:.8rem;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%}
.fld textarea{min-height:72px;resize:vertical}
.fld .hint{font-size:.74rem;color:var(--muted)}
input[type="date"],input[type="time"],input[type="url"],input[type="email"],input[type="number"]{direction:ltr;text-align:left}
html[dir="rtl"] input[type="date"],html[dir="rtl"] input[type="time"],html[dir="rtl"] input[type="url"],html[dir="rtl"] input[type="email"],html[dir="rtl"] input[type="number"]{text-align:right}
.check{display:flex;gap:8px;align-items:center}
.sublist{display:flex;flex-direction:column;gap:6px}
.subrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.subrow input[type=text]{flex:1;min-width:120px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent);font-weight:600}
.log{font-size:.8rem;display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.log div{border-inline-start:2px solid var(--line);padding-inline-start:8px}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;z-index:90;font-size:.9rem;max-width:calc(100% - 32px)}
@media (min-width:900px){.toast{bottom:24px}}
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:var(--r);background:var(--info-soft);color:var(--ink);font-size:.88rem;border:1px solid color-mix(in srgb,var(--info) 25%,transparent)}
.banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.banner.ai{background:var(--ai-soft);border-color:color-mix(in srgb,var(--ai) 30%,transparent)}
.banner.late{background:var(--late-soft);border-color:color-mix(in srgb,var(--late) 30%,transparent)}
.banner svg{width:18px;height:18px;flex:none;margin-top:2px}
.ai-out{white-space:pre-wrap;line-height:1.8;font-size:.92rem;overflow-wrap:anywhere}
.ai-out a{cursor:pointer;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.ai-card{border:1px solid color-mix(in srgb,var(--ai) 35%,var(--line));border-radius:var(--r);background:var(--surface);overflow:hidden}
.ai-card .hd{background:var(--ai-soft);color:var(--ai);font-size:.78rem;font-weight:600;padding:6px 12px;display:flex;gap:8px;align-items:center}
.ai-card .bd{padding:12px}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:.84rem}
.chip:hover{border-color:var(--ai);color:var(--ai)}
.hello{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end}
.hello h1{font-size:1.9rem}
.hello .date{color:var(--muted);font-size:.9rem}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.88rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.scorebar{display:flex;gap:3px} .scorebar i{width:10px;height:10px;border-radius:2px;background:var(--surface-2)} .scorebar i.on{background:var(--saffron)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted)}

    footer: [h('button', { class: 'btn primary', onclick: save }, 'إرسال التحديث'), h('button', { class: 'btn', onclick: () => m.close() }, 'إغلاق')] });
  async function save() {
    const d = readForm(form); const n = { ...up, updatedAt: nowISO(), requestApproval: !!d.requestApproval };
    if (p.status !== false) n.status = d.status; if (p.progress !== false) n.progress = +d.progress; if (p.blocker !== false) n.blocker = d.blocker;
    if (p.comment !== false && d.comment) n.comments = [...(up.comments || []), { at: nowISO(), text: d.comment.slice(0, 2000) }].slice(-50);
    if (files) { const fl = files.get(); if (fl.some(f => f.url && !/^https?:\/\//i.test(f.url))) { toast('يجب أن تبدأ الروابط بـ https://'); return; } n.files = fl; }
    if (n.status === 'done' && it.needsApproval && !n.requestApproval) n.requestApproval = true;
    form.dataset.dirty = '0'; m.close(true);
    try { await enqueue(`inbox/${S.uid}/updates/${id}`, () => S.db.doc(`inbox/${S.uid}/updates/${id}`).set(n)); toast('أُرسل التحديث إلى المدير'); } catch (e) { toast(dbErr(e), 5000); }
  }
}

boot();
</script>
</body>
</html>
